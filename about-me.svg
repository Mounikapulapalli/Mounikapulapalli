<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" font-family="'SF Pro Display','Segoe UI',Inter,Arial,sans-serif">
<defs>
  <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
  </linearGradient>
  <linearGradient id="hubFill" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3b1d78" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#1a1030" stop-opacity="0.55"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <style>
    .code-text { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .pulse-node { animation: pulsenode 3.2s ease-in-out infinite; }
    @keyframes pulsenode { 0%,100% { r: 5; opacity: .8; } 50% { r: 7; opacity: 1; } }
    .flow { stroke-dasharray: 5 9; animation: flowmove 2s linear infinite; }
    @keyframes flowmove { to { stroke-dashoffset: -140; } }
    .flow-slow { stroke-dasharray: 4 8; animation: flowmove 3s linear infinite; }
    .particle { animation: drift linear infinite; }
    @keyframes drift {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: .8; } 85% { opacity: .8; }
      100% { transform: translateY(-26px); opacity: 0; }
    }
    .num-pulse { animation: numpulse 4s ease-in-out infinite; }
    @keyframes numpulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .hub-ring { animation: ringspin 14s linear infinite; transform-origin: 800px 258px; }
    @keyframes ringspin { to { transform: rotate(360deg); } }
  </style>
</defs>

<rect width="1600" height="640" fill="#020203"/>

<g fill="#c4b5fd">
  <circle class="particle" cx="120" cy="70" r="1.6" style="animation-duration:7s"/>
  <circle class="particle" cx="1500" cy="100" r="1.4" style="animation-duration:6.4s; animation-delay:.6s"/>
  <circle class="particle" cx="1460" cy="560" r="1.6" style="animation-duration:6.8s; animation-delay:1.1s"/>
  <circle class="particle" cx="150" cy="580" r="1.4" style="animation-duration:6s; animation-delay:.3s"/>
</g>

<!-- heading -->
<text x="60" y="58" class="num-pulse" font-size="15" fill="#8b5cf6" letter-spacing="2" font-weight="600">01</text>
<text x="60" y="102" font-size="34" font-weight="700" fill="#f5f7ff" filter="url(#glow)" letter-spacing="0.4">About Me</text>
<line x1="60" y1="122" x2="1540" y2="122" stroke="#4c3a86" stroke-opacity="0.35"/>

<!-- ============ CONNECTOR PATHS (behind nodes) ============ -->
<g fill="none" stroke="#8b5cf6" stroke-width="1.6" opacity="0.75">
  <path class="flow" d="M320,205 C 320,240 620,240 720,258"/>
  <path class="flow" d="M800,205 C 800,225 800,235 800,240"/>
  <path class="flow" d="M1280,205 C 1280,240 980,240 880,258"/>

  <path class="flow-slow" d="M800,296 C 800,320 800,335 800,350"/>

  <path class="flow-slow" d="M800,410 C 800,430 800,435 800,452"/>

  <path class="flow" d="M800,510 C 800,535 640,535 560,556"/>
  <path class="flow" d="M800,510 C 800,530 800,540 800,556"/>
  <path class="flow" d="M800,510 C 800,535 1000,535 1090,556"/>
</g>

<!-- ============ TOP ROW: input sources ============ -->
<g class="breathe">
  <rect x="190" y="152" width="260" height="56" rx="14" fill="url(#glassFill)" stroke="#8b5cf6" stroke-opacity="0.4"/>
  <circle cx="216" cy="180" r="5" fill="#8b5cf6" filter="url(#glow)"/>
  <text x="234" y="185" font-size="14.5" fill="#e6e2fb" font-weight="600" letter-spacing="0.3">Finance</text>
</g>
<g class="breathe" style="animation-delay:.6s">
  <rect x="670" y="152" width="260" height="56" rx="14" fill="url(#glassFill)" stroke="#a855f7" stroke-opacity="0.4"/>
  <circle cx="696" cy="180" r="5" fill="#a855f7" filter="url(#glow)"/>
  <text x="714" y="185" font-size="14.5" fill="#e6e2fb" font-weight="600" letter-spacing="0.3">Systems Engineering</text>
</g>
<g class="breathe" style="animation-delay:1.2s">
  <rect x="1150" y="152" width="260" height="56" rx="14" fill="url(#glassFill)" stroke="#c4b5fd" stroke-opacity="0.4"/>
  <circle cx="1176" cy="180" r="5" fill="#c4b5fd" filter="url(#glow)"/>
  <text x="1194" y="185" font-size="14.5" fill="#e6e2fb" font-weight="600" letter-spacing="0.3">Process Design</text>
</g>

<!-- ============ HUB: central role node ============ -->
<ellipse cx="800" cy="258" rx="230" ry="70" fill="#8b5cf6" opacity="0.12" filter="url(#softGlow)"/>
<g class="hub-ring">
  <circle cx="800" cy="258" r="82" fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-dasharray="2 10"/>
</g>
<rect x="600" y="216" width="400" height="84" rx="18" fill="url(#hubFill)" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="1.4"/>
<text x="800" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#f5f7ff" filter="url(#glow)" letter-spacing="0.3">Workday Financial Systems Analyst</text>
<text x="800" y="278" text-anchor="middle" font-size="12.5" fill="#b9aef0" letter-spacing="1.5">4+ YEARS · ENTERPRISE ORGANIZATIONS</text>

<!-- ============ MID: translation node ============ -->
<g class="breathe" style="animation-delay:.3s">
  <rect x="570" y="350" width="460" height="60" rx="14" fill="url(#glassFill)" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="800" y="386" text-anchor="middle" font-size="15" fill="#dbe1f5" letter-spacing="0.2">Translating Complex Business Requirements</text>
</g>

<!-- ============ OUTPUT node ============ -->
<g class="breathe" style="animation-delay:.9s">
  <rect x="530" y="452" width="540" height="58" rx="14" fill="url(#glassFill)" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="800" y="487" text-anchor="middle" font-size="15.5" font-weight="600" fill="#f5f7ff" letter-spacing="0.2">Clean, Scalable Workday Configurations</text>
</g>

<!-- ============ PRINCIPLE branch nodes ============ -->
<g class="breathe" style="animation-delay:.2s">
  <rect x="430" y="556" width="200" height="46" rx="23" fill="#0c0a16" stroke="#7dd3a8" stroke-opacity="0.5"/>
  <circle cx="454" cy="579" r="4" fill="#7dd3a8"/>
  <text x="470" y="584" font-size="13" fill="#cdeede" font-weight="600" letter-spacing="0.3">Precision</text>
</g>
<g class="breathe" style="animation-delay:.7s">
  <rect x="690" y="556" width="220" height="46" rx="23" fill="#0c0a16" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <circle cx="714" cy="579" r="4" fill="#c4b5fd"/>
  <text x="730" y="584" font-size="13" fill="#e2dcf9" font-weight="600" letter-spacing="0.3">Auditability</text>
</g>
<g class="breathe" style="animation-delay:1.3s">
  <rect x="970" y="556" width="270" height="46" rx="23" fill="#0c0a16" stroke="#a855f7" stroke-opacity="0.5"/>
  <circle cx="994" cy="579" r="4" fill="#a855f7"/>
  <text x="1010" y="584" font-size="13" fill="#e6d9fb" font-weight="600" letter-spacing="0.3">Elegant System Design</text>
</g>

<!-- pulsing junction dots along the flow -->
<g fill="#c4b5fd">
  <circle class="pulse-node" cx="720" cy="258" r="5" style="animation-delay:0s"/>
  <circle class="pulse-node" cx="880" cy="258" r="5" style="animation-delay:.4s"/>
  <circle class="pulse-node" cx="800" cy="350" r="5" style="animation-delay:.8s"/>
  <circle class="pulse-node" cx="800" cy="452" r="5" style="animation-delay:1.2s"/>
</g>

<!-- closing line -->
<text x="800" y="628" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7fc0" letter-spacing="0.3">"Systems thinking meets financial precision."</text>

</svg>
