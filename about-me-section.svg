<svg viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg" font-family="'SF Pro Display','Segoe UI',Inter,Arial,sans-serif">
<defs>
  <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
  </linearGradient>

  <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    .code-text { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .breathe { animation: breathe 5.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .sweep-line { animation: sweep 4.5s linear infinite; }
    @keyframes sweep {
      0% { stroke-dashoffset: 700; }
      100% { stroke-dashoffset: 0; }
    }
    .num-pulse { animation: numpulse 4s ease-in-out infinite; }
    @keyframes numpulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .particle { animation: drift linear infinite; }
    @keyframes drift {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: .8; }
      85% { opacity: .8; }
      100% { transform: translateY(-24px); opacity: 0; }
    }
  </style>
</defs>

<rect width="1600" height="460" fill="#020203"/>

<!-- faint corner particles for continuity with the hero banner -->
<g fill="#c4b5fd">
  <circle class="particle" cx="140" cy="60" r="1.6" style="animation-duration:7s"/>
  <circle class="particle" cx="1500" cy="90" r="1.4" style="animation-duration:6.4s; animation-delay:.6s"/>
  <circle class="particle" cx="1450" cy="410" r="1.6" style="animation-duration:6.8s; animation-delay:1.1s"/>
</g>

<!-- section number + heading -->
<text x="60" y="58" class="num-pulse" font-size="15" fill="#8b5cf6" letter-spacing="2" font-weight="600">01</text>
<text x="60" y="102" font-size="34" font-weight="700" fill="#f5f7ff" filter="url(#glow)" letter-spacing="0.4">About Me</text>
<line x1="60" y1="122" x2="1540" y2="122" stroke="#4c3a86" stroke-opacity="0.4"/>
<line x1="60" y1="122" x2="360" y2="122" stroke="url(#borderFlow)" stroke-width="2" class="sweep-line" stroke-dasharray="300 700"/>

<!-- left card: narrative -->
<g class="breathe">
  <rect x="60" y="152" width="750" height="270" rx="16" fill="url(#glassFill)" stroke="#8b5cf6" stroke-opacity="0.28"/>
  <text x="90" y="196" font-size="16.5" fill="#dbe1f5" letter-spacing="0.2">
    <tspan x="90" dy="0">I'm a Workday Financial Systems Analyst with 4+ years of experience</tspan>
    <tspan x="90" dy="30">architecting and optimizing financial ecosystems for enterprise</tspan>
    <tspan x="90" dy="30">organizations. My work sits at the intersection of finance, systems</tspan>
    <tspan x="90" dy="30">engineering, and process design — translating complex business</tspan>
    <tspan x="90" dy="30">requirements into clean, scalable Workday configurations. I care about</tspan>
    <tspan x="90" dy="30">precision, auditability, and elegant system design — the same way a</tspan>
    <tspan x="90" dy="30">good engineer cares about clean code.</tspan>
  </text>
</g>

<!-- right card: yaml -->
<g class="breathe" style="animation-delay:1s">
  <rect x="838" y="152" width="702" height="270" rx="16" fill="#08090f" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.3"/>
  <circle cx="866" cy="178" r="4" fill="#ef4444" opacity="0.7"/>
  <circle cx="882" cy="178" r="4" fill="#eab308" opacity="0.7"/>
  <circle cx="898" cy="178" r="4" fill="#22c55e" opacity="0.7"/>
  <text x="866" y="180" class="code-text" font-size="10" fill="#6b7280" text-anchor="start" dx="0" dy="0" opacity="0"> </text>

  <text x="1490" y="178" class="code-text" font-size="11" fill="#6b7280" text-anchor="end">about.yaml</text>

  <text class="code-text" font-size="15" x="866" y="215">
    <tspan x="866" dy="0"><tspan fill="#c4b5fd">role:</tspan> <tspan fill="#dbe1f5">Financial Systems Analyst</tspan></tspan>
    <tspan x="866" dy="28"><tspan fill="#c4b5fd">platform:</tspan> <tspan fill="#dbe1f5">Workday</tspan></tspan>
    <tspan x="866" dy="28"><tspan fill="#c4b5fd">focus:</tspan></tspan>
    <tspan x="886" dy="26"><tspan fill="#7dd3a8">-</tspan> <tspan fill="#dbe1f5">Financials</tspan></tspan>
    <tspan x="886" dy="24"><tspan fill="#7dd3a8">-</tspan> <tspan fill="#dbe1f5">Adaptive Planning</tspan></tspan>
    <tspan x="886" dy="24"><tspan fill="#7dd3a8">-</tspan> <tspan fill="#dbe1f5">Integrations</tspan></tspan>
    <tspan x="886" dy="24"><tspan fill="#7dd3a8">-</tspan> <tspan fill="#dbe1f5">Reporting &amp; Analytics</tspan></tspan>
    <tspan x="866" dy="30"><tspan fill="#c4b5fd">experience:</tspan> <tspan fill="#dbe1f5">4+ years</tspan></tspan>
    <tspan x="866" dy="28"><tspan fill="#c4b5fd">mindset:</tspan> <tspan fill="#dbe1f5">systems-first</tspan></tspan>
  </text>
  <rect x="866" y="401" width="7" height="13" fill="#c4b5fd" class="blink"/>
</g>

</svg>
