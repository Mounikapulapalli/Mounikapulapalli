<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" font-family="'SF Pro Display','Segoe UI',Inter,Arial,sans-serif">
<defs>
  <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
    <stop offset="0%" stop-color="#241a45"/>
    <stop offset="45%" stop-color="#0d1226"/>
    <stop offset="100%" stop-color="#05060d"/>
  </radialGradient>

  <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
  </linearGradient>

  <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
  </linearGradient>

  <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
  </linearGradient>

  <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="frame"><rect x="0" y="0" width="1600" height="500" rx="0"/></clipPath>

  <style>
    .card { animation: breathe 5.5s ease-in-out infinite; }
    .card2 { animation: breathe 6.5s ease-in-out infinite; animation-delay: .8s; }
    .card3 { animation: breathe 5s ease-in-out infinite; animation-delay: 1.6s; }
    .card4 { animation: breathe 7s ease-in-out infinite; animation-delay: 2.2s; }
    @keyframes breathe {
      0%,100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .bg-pulse { animation: bgpulse 9s ease-in-out infinite; }
    @keyframes bgpulse {
      0%,100% { opacity: 0.55; }
      50% { opacity: 0.85; }
    }
    .particle { animation: drift linear infinite; }
    @keyframes drift {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
    .flow-line { stroke-dasharray: 6 10; animation: flow 2.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -160; } }
    .bar { animation: barpulse 3.4s ease-in-out infinite; transform-origin: bottom; }
    @keyframes barpulse {
      0%,100% { transform: scaleY(1); }
      50% { transform: scaleY(1.12); }
    }
    .sweep { animation: sweepmove 7s ease-in-out infinite; }
    @keyframes sweepmove {
      0% { transform: translateX(-500px); }
      100% { transform: translateX(2100px); }
    }
    .blink { animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    .scroll-dot { animation: scrolldrift 2s ease-in-out infinite; }
    @keyframes scrolldrift {
      0% { transform: translateY(0); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(14px); opacity: 0; }
    }
    .code-text { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
</defs>

<rect width="1600" height="500" fill="url(#bgGlow)"/>

<!-- ambient breathing glow blobs -->
<ellipse class="bg-pulse" cx="420" cy="150" rx="360" ry="220" fill="#8b5cf6" opacity="0.18" filter="url(#softBlur)"/>
<ellipse class="bg-pulse" cx="1180" cy="360" rx="380" ry="230" fill="#8b5cf6" opacity="0.16" filter="url(#softBlur)"/>
<ellipse class="bg-pulse" cx="800" cy="60" rx="300" ry="140" fill="#6d28d9" opacity="0.12" filter="url(#softBlur)"/>

<g clip-path="url(#frame)">

<!-- faint network mesh background -->
<g stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="1">
  <line x1="0" y1="80" x2="1600" y2="180"/>
  <line x1="0" y1="420" x2="1600" y2="340"/>
  <line x1="200" y1="0" x2="500" y2="500"/>
  <line x1="1300" y1="0" x2="1050" y2="500"/>
</g>
<g fill="#8b5cf6" opacity="0.5">
  <circle cx="200" cy="65" r="2"/>
  <circle cx="500" cy="150" r="2"/>
  <circle cx="1300" cy="90" r="2"/>
  <circle cx="1050" cy="430" r="2"/>
</g>

<!-- ============ LEFT PANEL: financial dashboard ============ -->
<g class="card">
  <rect x="60" y="70" width="360" height="200" rx="18" fill="url(#glassFill)" stroke="#a78bfa" stroke-opacity="0.35"/>
  <text x="86" y="105" fill="#c9b6f5" font-size="13" letter-spacing="1.5">GL &amp; CLOSE ANALYTICS</text>
  <line x1="86" y1="118" x2="394" y2="118" stroke="#8b5cf6" stroke-opacity="0.25"/>
  <!-- animated bars -->
  <g fill="url(#blueGlow)">
    <rect class="bar" x="96" y="180" width="20" height="70" rx="3" style="animation-delay:0s"/>
    <rect class="bar" x="130" y="150" width="20" height="100" rx="3" style="animation-delay:.3s"/>
    <rect class="bar" x="164" y="200" width="20" height="50" rx="3" style="animation-delay:.6s"/>
    <rect class="bar" x="198" y="140" width="20" height="110" rx="3" style="animation-delay:.9s"/>
    <rect class="bar" x="232" y="165" width="20" height="85" rx="3" style="animation-delay:1.2s"/>
    <rect class="bar" x="266" y="120" width="20" height="130" rx="3" style="animation-delay:1.5s"/>
  </g>
  <path d="M96 200 L130 175 L164 210 L198 155 L232 185 L266 130" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.8"/>
  <text x="330" y="100" fill="#7dd3a8" font-size="12" font-weight="600">+24.6%</text>
</g>

<!-- SQL editor window -->
<g class="card2">
  <rect x="60" y="300" width="330" height="130" rx="14" fill="#0b0f1c" fill-opacity="0.75" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <circle cx="82" cy="320" r="4" fill="#ef4444" opacity="0.7"/>
  <circle cx="98" cy="320" r="4" fill="#eab308" opacity="0.7"/>
  <circle cx="114" cy="320" r="4" fill="#22c55e" opacity="0.7"/>
  <text x="82" y="350" class="code-text" fill="#c4b5fd" font-size="12">SELECT cost_center, SUM(balance)</text>
  <text x="82" y="368" class="code-text" fill="#a5b4fc" font-size="12">FROM gl.journal_entries</text>
  <text x="82" y="386" class="code-text" fill="#c4b5fd" font-size="12">WHERE close_cycle = 'Q2_2026'</text>
  <text x="82" y="404" class="code-text" fill="#c4b5fd" font-size="12">GROUP BY cost_center;</text>
  <rect x="82" y="410" width="7" height="12" fill="#c4b5fd" class="blink"/>
</g>

<!-- ============ RIGHT PANEL: API / network flow ============ -->
<g class="card3">
  <rect x="1180" y="60" width="360" height="190" rx="18" fill="url(#glassFill)" stroke="#a855f7" stroke-opacity="0.35"/>
  <text x="1206" y="94" fill="#c9b6f5" font-size="13" letter-spacing="1.5">API &amp; SYSTEM FLOW</text>
  <line x1="1206" y1="107" x2="1512" y2="107" stroke="#a855f7" stroke-opacity="0.25"/>
  <g stroke="#8b5cf6" stroke-width="1.6" fill="none" opacity="0.85">
    <path class="flow-line" d="M1230 150 L1300 150"/>
    <path class="flow-line" d="M1330 150 L1400 190"/>
    <path class="flow-line" d="M1330 150 L1400 120"/>
    <path class="flow-line" d="M1430 120 L1490 120"/>
    <path class="flow-line" d="M1430 190 L1490 190"/>
  </g>
  <circle cx="1220" cy="150" r="10" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="1315" cy="150" r="9" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="1415" cy="120" r="8" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="1415" cy="190" r="8" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="1505" cy="120" r="6" fill="#c4b5fd"/>
  <circle cx="1505" cy="190" r="6" fill="#c4b5fd"/>
  <text x="1206" y="225" fill="#a5b4fc" font-size="11">Workday · SFTP · Cloud ETL</text>
</g>

<!-- cloud architecture mini diagram -->
<g class="card4">
  <rect x="1210" y="280" width="180" height="150" rx="14" fill="url(#glassFill)" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="1230" y="308" fill="#c9b6f5" font-size="12" letter-spacing="1">CLOUD ARCH</text>
  <ellipse cx="1300" cy="345" rx="34" ry="16" fill="none" stroke="#c4b5fd" stroke-opacity="0.7"/>
  <ellipse cx="1260" cy="380" rx="26" ry="13" fill="none" stroke="#c4b5fd" stroke-opacity="0.7"/>
  <ellipse cx="1340" cy="385" rx="26" ry="13" fill="none" stroke="#c4b5fd" stroke-opacity="0.7"/>
  <line x1="1300" y1="358" x2="1260" y2="370" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <line x1="1300" y1="358" x2="1340" y2="373" stroke="#c4b5fd" stroke-opacity="0.5"/>
</g>

<!-- python automation window (bottom left, small) -->
<g class="card">
  <rect x="420" y="378" width="260" height="82" rx="12" fill="#0b0f1c" fill-opacity="0.7" stroke="#8b5cf6" stroke-opacity="0.28"/>
  <text x="440" y="400" class="code-text" fill="#7dd3a8" font-size="11">def reconcile_subledger(entries):</text>
  <text x="440" y="416" class="code-text" fill="#c4b5fd" font-size="11">    validate(entries)</text>
  <text x="440" y="432" class="code-text" fill="#c4b5fd" font-size="11">    eib_load_to_workday(entries)</text>
  <rect x="440" y="438" width="6" height="10" fill="#7dd3a8" class="blink"/>
</g>

<!-- ERP workflow strip top center -->
<g class="card2">
  <rect x="640" y="40" width="320" height="46" rx="12" fill="url(#glassFill)" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <g font-size="10" fill="#c4b5fd">
    <circle cx="668" cy="63" r="6" fill="#8b5cf6"/>
    <line class="flow-line" x1="676" y1="63" x2="720" y2="63" stroke="#8b5cf6" stroke-width="1.4"/>
    <circle cx="728" cy="63" r="6" fill="#8b5cf6"/>
    <line class="flow-line" x1="736" y1="63" x2="780" y2="63" stroke="#8b5cf6" stroke-width="1.4"/>
    <circle cx="788" cy="63" r="6" fill="#a855f7"/>
    <line class="flow-line" x1="796" y1="63" x2="840" y2="63" stroke="#8b5cf6" stroke-width="1.4"/>
    <circle cx="848" cy="63" r="6" fill="#c4b5fd"/>
    <text x="655" y="82" font-size="9" fill="#c9b6f5" letter-spacing="0.5">Intake → Validate → Approve → Post</text>
  </g>
</g>

<!-- ============ CENTER: name / title / tagline ============ -->
<g text-anchor="middle">
  <rect x="500" y="195" width="600" height="1" fill="#8b5cf6" opacity="0.25"/>
  <text x="800" y="255" font-size="52" font-weight="700" fill="#f5f7ff" filter="url(#glow)" letter-spacing="0.5">Mounika Pulapalli</text>
  <text x="800" y="292" font-size="19" font-weight="500" fill="#8fb3ff" letter-spacing="2">WORKDAY FINANCIAL SYSTEMS ANALYST</text>
  <text x="800" y="322" font-size="14.5" fill="#a9b4d0" letter-spacing="0.3">Transforming Enterprise Finance through Workday, Analytics &amp; Intelligent Automation</text>
  <rect x="640" y="340" width="320" height="1" fill="#8b5cf6" opacity="0.3"/>
</g>

<!-- floating particles -->
<g fill="#c4b5fd">
  <circle class="particle" cx="500" cy="420" r="2" style="animation-duration:6s; animation-delay:0s"/>
  <circle class="particle" cx="560" cy="440" r="1.5" style="animation-duration:7s; animation-delay:1s"/>
  <circle class="particle" cx="1020" cy="430" r="2" style="animation-duration:5.5s; animation-delay:.4s"/>
  <circle class="particle" cx="1080" cy="410" r="1.5" style="animation-duration:6.5s; animation-delay:1.6s"/>
  <circle class="particle" cx="780" cy="450" r="1.8" style="animation-duration:6s; animation-delay:.8s"/>
  <circle class="particle" cx="920" cy="90" r="1.6" style="animation-duration:7.5s; animation-delay:.2s"/>
  <circle class="particle" cx="440" cy="60" r="1.6" style="animation-duration:6.8s; animation-delay:1.1s"/>
  <circle class="particle" cx="1150" cy="470" r="1.4" style="animation-duration:5.8s; animation-delay:.6s"/>
</g>

<!-- scroll indicator -->
<g transform="translate(800,478)" text-anchor="middle">
  <rect x="-9" y="-16" width="18" height="28" rx="9" fill="none" stroke="#c4b5fd" stroke-opacity="0.5"/>
  <circle class="scroll-dot" cx="0" cy="-8" r="2.4" fill="#c4b5fd"/>
</g>

<!-- light sweep -->
<rect class="sweep" x="0" y="0" width="400" height="500" fill="url(#sweepGrad)" transform="skewX(-18)"/>

</g>

<!-- outer vignette -->
<rect width="1600" height="500" fill="url(#bgGlow)" opacity="0" />
<rect x="0" y="0" width="1600" height="500" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="40"/>
</svg>
